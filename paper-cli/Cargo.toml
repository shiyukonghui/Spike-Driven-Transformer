[package]
name = "paper-cli"
version = "0.1.0"
edition = "2021"
description = "ModelScope 论文检索 CLI（PUT /api/v1/dolphin/papers）——SDT-ES 研究的思路检索工具"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 2
